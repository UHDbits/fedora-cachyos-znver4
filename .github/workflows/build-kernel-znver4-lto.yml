name: Build kernel-cachyos-znver4-lto

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force triggering a COPR rebuild even if version already exists"
        type: boolean
        default: false
      tag:
        description: "Optional CachyOS/linux tag override (e.g. cachyos-7.3.6-2)"
        type: string
        default: ""
  schedule:
    - cron: "0 20 * * *"

concurrency:
  group: build-kernel-znver4-lto
  cancel-in-progress: false

env:
  SPEC_PATH: sources/kernel-cachyos-bore/kernel-cachyos-lto.spec
  PKG_NAME: kernel-cachyos-znver4-lto
  COPR_USERNAME: ${{ vars.COPR_USERNAME || 'uhdbits' }}
  COPR_PROJECT: ${{ vars.COPR_PROJECT || 'kernel-cachyos-znver4-lto' }}

permissions:
  contents: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Resolve target CachyOS/linux release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_OVERRIDE: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Pattern: cachyos-X.Y.Z-N (stable releases only; excludes rc, hotfix, etc.)
          TAG_REGEX='^cachyos-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'

          if [ -n "$TAG_OVERRIDE" ]; then
            if ! [[ "$TAG_OVERRIDE" =~ $TAG_REGEX ]]; then
              echo "::error::Tag override '$TAG_OVERRIDE' does not match $TAG_REGEX"
              exit 1
            fi
            TAG="$TAG_OVERRIDE"
            echo "Using manually specified tag: $TAG"
          else
            # Pick the highest semver release rather than the most recent publish:
            # LTS releases (e.g. 6.18.x) are published alongside current stable releases.
            echo "Fetching releases from CachyOS/linux..."
            RELEASES_JSON=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/CachyOS/linux/releases?per_page=50")
            TAG=$(echo "$RELEASES_JSON" \
              | jq -r --arg re "$TAG_REGEX" \
                  '[.[] | select(.draft==false) | select(.prerelease==false) | .tag_name | select(test($re))]
                   | sort_by([scan("[0-9]+") | tonumber]) | last // empty')

            if [ -z "$TAG" ]; then
              echo "::error::Could not find a valid CachyOS/linux release matching $TAG_REGEX"
              exit 1
            fi
          fi

          # Tag format: cachyos-7.3.6-2
          BASEKVER=$(echo "$TAG" | sed -E 's/^cachyos-([0-9]+\.[0-9]+)\.[0-9]+-[0-9]+$/\1/')
          STABLEKVER=$(echo "$TAG" | sed -E 's/^cachyos-[0-9]+\.[0-9]+\.([0-9]+)-[0-9]+$/\1/')
          CACHYOSREL=$(echo "$TAG" | sed -E 's/^cachyos-[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)$/\1/')

          # Verify matching CachyOS kernel-patches exist for this major.minor series
          for patch in "sched/0001-bore-cachy.patch" "misc/dkms-clang.patch"; do
            PATCH_URL="https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${BASEKVER}/${patch}"
            if ! curl -fsSI "$PATCH_URL" >/dev/null; then
              echo "::error::Required patch not found at $PATCH_URL"
              exit 1
            fi
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "basekver=$BASEKVER" >> "$GITHUB_OUTPUT"
          echo "stablekver=$STABLEKVER" >> "$GITHUB_OUTPUT"
          echo "cachyosrel=$CACHYOSREL" >> "$GITHUB_OUTPUT"
          echo "expected_ver_rel=${BASEKVER}.${STABLEKVER}-${CACHYOSREL}.cachyos1.lto" >> "$GITHUB_OUTPUT"
          echo "Resolved release: $TAG -> _basekver=$BASEKVER _stablekver=$STABLEKVER _cachyosrel=$CACHYOSREL"

      - name: Check whether update or COPR build is needed
        id: check
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          CURRENT_TAG=$(grep -E '^%global _tag ' "$SPEC_PATH" | sed 's/^%global _tag //')
          LATEST_TAG="${{ steps.release.outputs.tag }}"
          EXPECTED_VER_REL="${{ steps.release.outputs.expected_ver_rel }}"

          echo "Current spec tag : $CURRENT_TAG"
          echo "Target upstream  : $LATEST_TAG ($EXPECTED_VER_REL)"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "force_build=true — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CURRENT_TAG" != "$LATEST_TAG" ]; then
            echo "New kernel version available: $LATEST_TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Spec matches upstream; check COPR's public API to see if this version
          # has already been built (also self-heals if a previous webhook call failed
          # or on first-time setup).
          PKG_JSON=$(curl -fsSL \
            "https://copr.fedorainfracloud.org/api_3/package/?ownername=$COPR_USERNAME&projectname=$COPR_PROJECT&packagename=$PKG_NAME&with_latest_build=True&with_latest_succeeded_build=True" \
            2>/dev/null || echo '{}')
          EXISTING=$(echo "$PKG_JSON" | jq -r '.builds.latest_succeeded.source_package.version // empty')
          RUNNING=$(echo "$PKG_JSON" | jq -r '
            .builds.latest // empty
            | select(.state? | IN("importing", "pending", "starting", "running", "waiting"))
            | .source_package.version // empty')

          echo "COPR latest succeeded : ${EXISTING:-none}"
          echo "COPR in progress      : ${RUNNING:-none}"

          if [ "$EXISTING" != "$EXPECTED_VER_REL" ] && [ "$RUNNING" != "$EXPECTED_VER_REL" ]; then
            echo "Version $EXPECTED_VER_REL is not yet built on COPR ($COPR_USERNAME/$COPR_PROJECT) — triggering build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version $LATEST_TAG is already up to date on COPR — skipping."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Update spec and push commit
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail

          BASEKVER="${{ steps.release.outputs.basekver }}"
          STABLEKVER="${{ steps.release.outputs.stablekver }}"
          CACHYOSREL="${{ steps.release.outputs.cachyosrel }}"
          TAG="${{ steps.release.outputs.tag }}"

          sed -i "s/^%global _basekver .*/%global _basekver ${BASEKVER}/" "$SPEC_PATH"
          sed -i "s/^%global _stablekver .*/%global _stablekver ${STABLEKVER}/" "$SPEC_PATH"
          sed -i "s/^%global _cachyosrel .*/%global _cachyosrel ${CACHYOSREL}/" "$SPEC_PATH"
          sed -i "s/^%global _tag .*/%global _tag ${TAG}/" "$SPEC_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH"
          if git diff --cached --quiet; then
            echo "Spec already at ${TAG}; no commit needed."
          else
            git commit -m "chore: bump kernel to ${TAG}"
            git push
          fi

      - name: Trigger COPR rebuild via custom webhook
        if: steps.check.outputs.skip != 'true'
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${COPR_WEBHOOK_URL:-}" ]; then
            echo "::error::COPR_WEBHOOK_URL secret is not set. Add your COPR Custom Webhook URL (Settings -> Integrations -> Custom webhook) as repository secret COPR_WEBHOOK_URL."
            exit 1
          fi

          echo "Triggering COPR SCM build for ${COPR_USERNAME}/${COPR_PROJECT} (${PKG_NAME})..."
          curl -fsSL -X POST "$COPR_WEBHOOK_URL"
          echo ""
          echo "COPR rebuild triggered successfully."
